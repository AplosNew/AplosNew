name: Deploy PratibhaPOP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore APLOS.New.sln

      - name: Build and Publish
        run: |
          msbuild APLOS.New.sln /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=FileSystem /p:PublishUrl=F:\Deploy\PratibhaPOP

      - name: Stop App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "pratibhapop"

      - name: Copy Files
        shell: powershell
        run: |
          robocopy "F:\Deploy\PratibhaPOP" "F:\aPOP\Pratibha\IIS\pratibhaPOP" /E /R:1 /W:1 /XF web.config
          if ($LASTEXITCODE -le 3) { exit 0 } else { exit $LASTEXITCODE }

      - name: Start App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "pratibhapop"
