name: Deploy PratibhaPOP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore Packages
      run: nuget restore APLOS.New.sln

    - name: Build Solution
      run: |
        msbuild APLOS.New.sln /p:Configuration=Release

    - name: Show Build Output
      shell: powershell
      run: |
        Write-Host "===== Searching for Aplos.dll ====="
        Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "Aplos.dll" | Select-Object FullName

        Write-Host "===== Release Folders ====="
        Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Directory | Where-Object {$_.FullName -like "*bin*Release*"} | Select-Object FullName

    - name: Stop IIS App Pool
      shell: powershell
      run: |
        Import-Module WebAdministration

        $pool = Get-WebAppPoolState -Name "pratibhapop"

        if ($pool.Value -eq "Started") {
            Stop-WebAppPool -Name "pratibhapop"
            Write-Host "App Pool Stopped"
        }
        else {
            Write-Host "App Pool Already Stopped"
        }

    - name: Copy DLL Files
      shell: powershell
      run: |

        $Source = Get-ChildItem `
          -Path "$env:GITHUB_WORKSPACE" `
          -Recurse `
          -Filter "Aplos.dll" |
          Select-Object -First 1

        if ($null -eq $Source) {
            Write-Error "Aplos.dll not found."
            exit 1
        }

        $SourceFolder = Split-Path $Source.FullName

        Write-Host "Source Folder:"
        Write-Host $SourceFolder

        robocopy `
          "$SourceFolder" `
          "F:\aPOP\Pratibha\IIS\pratibhaPOP\bin" `
          *.dll *.pdb `
          /R:1 /W:1

        if ($LASTEXITCODE -le 3) {
            exit 0
        }
        else {
            exit $LASTEXITCODE
        }

    - name: Start IIS App Pool
      shell: powershell
      run: |
        Import-Module WebAdministration
        Start-WebAppPool -Name "pratibhapop"

    - name: Deployment Complete
      shell: powershell
      run: |
        Write-Host "Deployment Successful"
