name: Deploy PratibhaPOP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: |
          dotnet publish -c Release -o F:\Deploy\PratibhaPOP

      - name: Stop App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "pratibhapoppop"

      - name: Copy Files
        shell: powershell
        run: |
          robocopy "F:\Deploy\BasicPOP" "F:\aPOP\Pratibha\IIS\pratibhaPOP" /E /R:1 /W:1 /XF web.config
          if ($LASTEXITCODE -le 3) { exit 0 } else { exit $LASTEXITCODE }

      - name: Start App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "pratibhapop"
