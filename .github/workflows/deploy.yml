name: Deploy APLOS

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: |
        nuget restore APLOS.New.sln

    - name: Build Solution
      run: |
        msbuild APLOS.New.sln `
          /p:Configuration=Release `
          /p:Platform="Any CPU"

    - name: Stop IIS
      shell: powershell
      run: |
        Import-Module WebAdministration

        if ((Get-WebAppPoolState -Name "pratibhapop").Value -eq "Started")
        {
            Stop-WebAppPool -Name "pratibhapop"
        }

    - name: Backup Web.config
      shell: powershell
      run: |
        Copy-Item `
          "F:\aPOP\Pratibha\IIS\pratibhaPOP\web.config" `
          "F:\aPOP\Pratibha\IIS\web.config.bak" `
          -Force

    - name: Deploy Website
      shell: powershell
      run: |

        robocopy `
          "$env:GITHUB_WORKSPACE\APLOS" `
          "F:\aPOP\Pratibha\IIS\pratibhaPOP" `
          /E `
          /XF web.config `
          /R:1 `
          /W:1

        if ($LASTEXITCODE -le 3)
        {
            exit 0
        }
        else
        {
            exit $LASTEXITCODE
        }

    - name: Restore Web.config
      shell: powershell
      run: |
        Copy-Item `
          "F:\aPOP\Pratibha\IIS\web.config.bak" `
          "F:\aPOP\Pratibha\IIS\pratibhaPOP\web.config" `
          -Force

    - name: Start IIS
      shell: powershell
      run: |
        Import-Module WebAdministration

        if ((Get-WebAppPoolState -Name "pratibhapop").Value -ne "Started")
        {
            Start-WebAppPool -Name "pratibhapop"
        }
