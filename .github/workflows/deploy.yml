name: Deploy APLOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

    # =========================
    # 1. Checkout Code
    # =========================
    - name: Checkout Code
      uses: actions/checkout@v4


    # =========================
    # 2. Clean Workspace (IMPORTANT)
    # =========================
    - name: Clean Workspace
      shell: powershell
      run: |
        git clean -xfd
        git reset --hard


    # =========================
    # 3. Restore Packages
    # =========================
    - name: Restore NuGet Packages
      shell: powershell
      run: |
        nuget restore APLOS.New.sln


    # =========================
    # 4. Build ONLY working project
    # (Avoid failing Library.Service.Extension issue)
    # =========================
    - name: Build Material Management Project
      shell: powershell
      run: |
        msbuild Aplos.MaterialManagement\Aplos.MaterialManagement.csproj `
          /p:Configuration=Release `
          /p:Platform="Any CPU"


    # =========================
    # 5. Stop IIS App Pool
    # =========================
    - name: Stop IIS
      shell: powershell
      run: |
        Import-Module WebAdministration

        if ((Get-WebAppPoolState -Name "pratibhapop").Value -eq "Started") {
            Stop-WebAppPool -Name "pratibhapop"
        }


    # =========================
    # 6. Deploy Files
    # =========================
    - name: Deploy Files
      shell: powershell
      run: |

        robocopy `
          "$env:GITHUB_WORKSPACE\APLOS" `
          "F:\aPOP\Pratibha\IIS\pratibhaPOP" `
          /E `
          /XF web.config `
          /R:1 `
          /W:1

        if ($LASTEXITCODE -le 3) {
            exit 0
        } else {
            exit $LASTEXITCODE
        }


    # =========================
    # 7. Start IIS App Pool
    # =========================
    - name: Start IIS
      shell: powershell
      run: |
        Import-Module WebAdministration

        if ((Get-WebAppPoolState -Name "pratibhapop").Value -ne "Started") {
            Start-WebAppPool -Name "pratibhapop"
        }
