name: Deploy APLOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

    # =========================
    # 1. Checkout Code
    # =========================
    - name: Checkout Code
      uses: actions/checkout@v4

    # =========================
    # 2. Clean Workspace
    # =========================
    - name: Clean Workspace
      shell: powershell
      run: |
        git clean -xfd
        git reset --hard

    # =========================
    # 3. Set MSBuild Path
    # =========================
    - name: Set MSBuild Path
      shell: powershell
      run: |
        echo "MSBUILD_EXE=C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe" >> $env:GITHUB_ENV

    # =========================
    # 4. Restore Packages
    # =========================
    - name: Restore Dependencies
      shell: powershell
      run: |
        dotnet restore APLOS.New.sln

    # =========================
    # 5. Build Project
    # =========================
    - name: Build Material Management Project
      shell: powershell
      run: |
        & "$env:MSBUILD_EXE" `
          Aplos.MaterialManagement\Aplos.MaterialManagement.csproj `
          /t:Build `
          /p:Configuration=Release `
          /p:Platform="Any CPU"

    # =========================
    # 6. Stop IIS App Pool
    # =========================
    - name: Stop IIS
      shell: powershell
      run: |
        Import-Module WebAdministration

        if ((Get-WebAppPoolState -Name "pratibhapop").Value -eq "Started") {
          Stop-WebAppPool -Name "pratibhapop"
        }

    # =========================
    # 7. Deploy Files
    # =========================
    - name: Deploy Files
      shell: powershell
      run: |
        robocopy `
          "$env:GITHUB_WORKSPACE\APLOS" `
          "F:\aPOP\Pratibha\IIS\pratibhaPOP" `
          /E `
          /XF web.config `
          /R:1 `
          /W:1

        if ($LASTEXITCODE -le 3) {
          exit 0
        }
        else {
          exit $LASTEXITCODE
        }

    # =========================
    # 8. Start IIS App Pool
    # =========================
    - name: Start IIS
      shell: powershell
      run: |
        Import-Module WebAdministration

        if ((Get-WebAppPoolState -Name "pratibhapop").Value -ne "Started") {
          Start-WebAppPool -Name "pratibhapop"
        }
