name: Deploy APLOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore Packages
      shell: powershell
      run: |
        nuget restore APLOS.New.sln

    - name: Locate MSBuild
      shell: powershell
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

        $msbuild = & $vswhere `
          -latest `
          -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe

        echo "MSBuild Path: $msbuild"

        echo "MSBUILD_EXE=$msbuild" >> $env:GITHUB_ENV

    - name: Build Solution
      shell: powershell
      run: |
        & "$env:MSBUILD_EXE" `
          APLOS.New.sln `
          /p:Configuration=Release `
          /p:Platform="Any CPU"

    - name: Stop IIS
      shell: powershell
      run: |
        Import-Module WebAdministration

        if ((Get-WebAppPoolState -Name "pratibhapop").Value -eq "Started")
        {
            Stop-WebAppPool -Name "pratibhapop"
        }

    - name: Deploy Files
      shell: powershell
      run: |

        robocopy `
          "$env:GITHUB_WORKSPACE\APLOS" `
          "F:\aPOP\Pratibha\IIS\pratibhaPOP" `
          /E `
          /XF web.config `
          /R:1 `
          /W:1

        if ($LASTEXITCODE -le 3)
        {
            exit 0
        }
        else
        {
            exit $LASTEXITCODE
        }

    - name: Start IIS
      shell: powershell
      run: |
        Import-Module WebAdministration

        if ((Get-WebAppPoolState -Name "pratibhapop").Value -ne "Started")
        {
            Start-WebAppPool -Name "pratibhapop"
        }
