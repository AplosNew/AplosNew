name: Deploy PratibhaPOP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore APLOS.New.sln

      - name: Copy Aplos.Service.Extension DLL
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Aplos.Service.Extension\bin\Debug"

          Copy-Item `
            "F:\aPOP\Pratibha\IIS\pratibhaPOP\bin\Aplos.Service.Extension.dll" `
            "$env:GITHUB_WORKSPACE\Aplos.Service.Extension\bin\Debug\" `
            -Force

      - name: Build Solution
        run: |
          msbuild APLOS.New.sln /p:Configuration=Release

      - name: Stop IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "pratibhapop"

      - name: Copy DLL Files
        shell: powershell
        run: |
          robocopy `
            "$env:GITHUB_WORKSPACE\APLOS\bin\Release" `
            "F:\aPOP\Pratibha\IIS\pratibhaPOP\bin" `
            *.dll *.pdb /R:1 /W:1

          if ($LASTEXITCODE -le 3) {
            exit 0
          } else {
            exit $LASTEXITCODE
          }

      - name: Start IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "pratibhapop"
